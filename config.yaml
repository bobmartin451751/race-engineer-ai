# race-engineer-ai configuration
# Everything here is optional; defaults live in app/config.py.

telemetry:
  host: 0.0.0.0
  port: 20777          # must match F1 24 > Settings > Telemetry Settings

audio:
  input_device: null    # null = Windows default mic; use --devices to find names/indices
  output_device: null   # null = Windows default output (your headset)
  ptt_key: f9           # tap this to talk (or hold, with ptt_mode: hold)
  ptt_mode: tap         # tap = press once, say "over", auto-send | hold = push-to-talk
  end_on_silence_s: 1.2 # send anyway after this much silence
  over_check_interval_s: 0.8  # how often to listen for the word "over" while recording
  over_words: ["over", "over and out"]
  record_max_seconds: 25
  sample_rate: 16000

stt:
  model: small.en       # final transcription
  spotter_model: tiny.en  # fast model that listens for "over" while recording
  device: cpu           # "cuda" also works if cuBLAS + cuDNN 9 are installed
  compute_type: int8
  language: en
  beam_size: 1

tts:
  piper_exe: models/piper/piper.exe
  voice_model: models/piper/en_GB-alan-medium.onnx
  radio_filter: true    # band-limited, saturated, with a squelch click
  volume: 1.0
  speed: 1.05

brain:
  default_provider: local
  smart_provider: deepseek
  # Questions containing these words (or longer than escalate_min_words)
  # go to the smart provider instead of the local 7B model.
  escalate_when:
    - why
    - should
    - strategy
    - undercut
    - overcut
    - choice
    - compare
    - explain
    - plan
    - recommend
    - predict
  escalate_min_words: 12
  providers:
    local:
      base_url: http://127.0.0.1:8080/v1
      model: qwen2.5-7b-instruct
      api_key: local
      temperature: 0.3
      max_tokens: 220
      timeout_s: 12
      # If the local model has not answered in this many seconds, the
      # engineer speaks a deterministic telemetry answer instead of silence.
      first_token_deadline_s: 8.0
    deepseek:
      base_url: https://api.deepseek.com/v1
      model: deepseek-flash
      api_key_env: DEEPSEEK_API_KEY
      temperature: 0.3
      max_tokens: 220
      timeout_s: 20
      disable_thinking: true   # thinking mode would add seconds of silent latency

engineer:
  name: Race engineer
  max_sentences: 2
  proactive: true       # speak up about tyres, fuel, flags, pit window, rain
  cooldown_s: 20        # minimum seconds between unsolicited radio calls

strategy:
  pit_loss_s: 21.0      # seconds lost in the pit lane at this track
  traffic_window_s: 2.0 # cars within this gap of your rejoin count as traffic

overlay:
  enabled: true         # launch the always-on-top panel with the engineer
  state_file: .temp/live_state.json
  x: 40
  y: 40
  scale: 1.0
  opacity: 0.88
  toggle_key: f10       # show/hide the panel
